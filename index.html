<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0912"><title>Yorunime - Nonton Anime Sub Indo</title>
<style>
:root{--bg:#0b0912;--s:#16131f;--ln:#2b2639;--tx:#efeaf7;--mu:#9690ab;--gd:#e0ae52;--rd:#dc3b55;--vi:#7d5cff;--sc:#fff;--ss:100%}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:radial-gradient(800px 420px at 92% -8%,#2b1858,transparent 62%),var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:64px 0 84px;-webkit-tap-highlight-color:transparent}
a,button{color:inherit;text-decoration:none;cursor:pointer}button,input,select{font:inherit;color:inherit}
h1,h2,.lg,.pr{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.02em}
h2{font-size:21px;margin:30px 16px 12px}.mu{color:var(--mu)}.gd{color:var(--gd)}
header{position:fixed;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(11,9,18,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.lg{font-size:22px;font-style:italic}.lg:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rd);margin-right:7px}
#q{flex:1}#qi{width:100%;height:36px;border-radius:18px;padding:0 14px}
header button{background:var(--s);border:1px solid var(--ln);border-radius:18px;height:36px;padding:0 13px}
input,select{background:var(--s);border:1px solid var(--ln);border-radius:9px;padding:9px 11px;outline:0}input:focus{border-color:var(--vi)}
input[type=color],input[type=range]{padding:0;border:0;background:none}
#bn{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(11,9,18,.94);backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
#bn a{flex:1;text-align:center;padding:13px 0;font-size:12px;color:var(--mu)}
#app{max-width:1180px;margin:auto}
.hero{padding:34px 16px 4px}.hero h1{font-size:clamp(40px,10vw,78px);line-height:.98;margin-bottom:16px;max-width:9em}
.tk{display:inline-grid;gap:6px;padding:14px 18px;background:var(--s);border:1px solid var(--ln);border-left:2px dashed var(--gd);border-radius:4px 16px 16px 4px}
.pp{display:flex;gap:6px}.pp i{width:28px;height:8px;border-radius:2px;background:var(--gd)}.pp i.u{background:var(--ln)}
.bt{display:inline-block;background:linear-gradient(135deg,var(--rd),var(--vi));border:0;border-radius:999px;padding:11px 20px;font-weight:600;margin:10px 8px 0 0;text-align:center}.bt.g{background:none;border:1px solid var(--ln)}
.rw{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity}.rw::-webkit-scrollbar{display:none}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:0 16px}
.cd{position:relative;display:block;flex:0 0 136px;scroll-snap-align:start}
.cd i{display:block;aspect-ratio:2/3;border-radius:6px;background:var(--s) center/cover;border:1px solid var(--ln);transition:transform .2s}.cd:hover i{transform:translateY(-3px)}
.cd em{position:absolute;top:7px;left:7px;font-style:normal;font-size:11px;background:rgba(11,9,18,.85);color:var(--gd);padding:1px 7px;border-radius:3px}
.cd b{display:block;font-size:13px;margin-top:7px;line-height:1.3;max-height:2.6em;overflow:hidden}.cd small{color:var(--mu);font-size:12px}
.sk{background:linear-gradient(90deg,var(--s),#221f31,var(--s));background-size:200% 100%;animation:sh 1.3s infinite;min-height:200px;flex:0 0 136px;border-radius:6px}@keyframes sh{to{background-position:-200% 0}}
.fl{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.dt{display:flex;gap:22px;padding:20px 16px;flex-wrap:wrap}.dt>i{width:min(46vw,220px);aspect-ratio:2/3;border-radius:6px;background:center/cover;border:1px solid var(--ln)}.dt>div{flex:1;min-width:260px}.dt h1{font-size:clamp(26px,6vw,44px);line-height:1.08}
.mt{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:13px}.ch{display:inline-block;border:1px solid var(--ln);border-radius:4px;padding:3px 10px;margin:3px 6px 3px 0;font-size:12px}
.sy{margin:10px 0;color:#cbc6da;max-height:9.5em;overflow:auto;max-width:70ch}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;padding:0 16px}.ep{text-align:center;padding:11px 0;border:1px solid var(--ln);border-radius:8px;background:var(--s)}.ep:hover{border-color:var(--gd)}.ep.dn{color:var(--mu);border-style:dashed}
.pl{position:relative;background:#000;aspect-ratio:16/9;max-height:78vh;margin:0 auto;max-width:1100px}.pl video{width:100%;height:100%;display:block}
video::cue{color:var(--sc);font-size:var(--ss);background:rgba(0,0,0,.65)}
.sk1{position:absolute;right:12px;bottom:64px;background:rgba(11,9,18,.88);border:1px solid var(--gd);color:var(--gd);border-radius:6px;padding:8px 14px}
.ov{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(0,0,0,.82);gap:6px}
.pc{padding:14px 16px;max-width:1100px;margin:auto}.pc h1{font-size:23px}.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;font-size:13px}
.ad{display:flex;align-items:center;gap:12px;margin:20px 16px;padding:14px 16px;border-radius:10px 4px 10px 4px;border:1px solid rgba(255,255,255,.12)}.ad small{font-size:11px;opacity:.7}.ad b{font-family:Georgia,serif;font-size:18px}.ad span{margin-left:auto;font-size:13px;opacity:.85;text-align:right}
.mo{position:fixed;inset:0;z-index:50;background:rgba(5,4,10,.78);display:grid;place-items:end center;backdrop-filter:blur(6px)}
.mb{background:var(--s);border:1px solid var(--ln);border-radius:18px 18px 0 0;width:min(440px,100%);padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:grid;gap:10px;max-height:90vh;overflow:auto;animation:up .28s}
@media(min-width:640px){.mo{place-items:center}.mb{border-radius:18px}}@keyframes up{from{transform:translateY(24px);opacity:0}}
.mb h2{margin:0}.mb .bt{width:100%;margin:0}.pr{font-size:34px;color:var(--gd)}.pr small{font-size:14px;color:var(--mu)}
.gp{border:1px dashed var(--gd);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}.gp b{font-size:20px;flex:1}
.mb ol,.mb ul{padding-left:20px;color:var(--mu)}
#ts{position:fixed;left:0;right:0;bottom:84px;z-index:60;display:grid;justify-items:center;gap:6px;pointer-events:none}.t{background:#241f35;border:1px solid var(--gd);padding:9px 16px;border-radius:10px;animation:up .25s}
.cf{display:flex;gap:8px;padding:0 16px}.cf input{flex:1}.cmt{margin:12px 16px;padding:11px 14px;background:var(--s);border-radius:4px 12px 12px 12px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:30px 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><a class="lg" href="#/">Yorunime</a><div id="q"><input id="qi" placeholder="Cari judul Indonesia, English, Jepang" autocomplete="off"></div><button id="bell">Notif</button><button id="ua">Masuk</button></header>
<main id="app"></main>
<footer><a href="#/" onclick="dmca();return false">DMCA &amp; Disclaimer</a></footer>
<nav id="bn"><a href="#/">Beranda</a><a href="#/cari">Jelajah</a><a href="#/list">Daftarku</a><a href="#/premium">Premium</a></nav>
<div id="md"></div><div id="ts"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),L=(k,d)=>{try{return JSON.parse(localStorage[k])??d}catch{return d}},W=(k,v)=>localStorage[k]=JSON.stringify(v);
const SB='https://xqfctjxdcwxalcuufikd.supabase.co',KEY='sb_publishable_AJYWCVpp7ZIMQPOc8IhmPQ_2M-7-L00',LIM=5,app=$('#app'),WA='6288801883795';
let S=L('sess',null),prem=false,used=0,ready=Promise.resolve(),tm;
const today=()=>new Date(Date.now()+252e5).toISOString().slice(0,10);
const toast=m=>{const t=document.createElement('div');t.className='t';t.textContent=m;$('#ts').append(t);setTimeout(()=>t.remove(),3200)};
/* ---- Supabase (REST + Auth lewat fetch) ---- */
async function ax(p,b,tk){const r=await fetch(SB+'/auth/v1/'+p,{method:b?'POST':'GET',headers:{apikey:KEY,'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Gagal');return j}
function setS(j){if(!j.access_token)return;S={t:j.access_token,r:j.refresh_token,u:j.user,x:Date.now()+(j.expires_in||3600)*1e3-6e4};W('sess',S)}
async function db(p,o={}){if(S&&Date.now()>S.x){try{setS(await ax('token?grant_type=refresh_token',{refresh_token:S.r}))}catch{S=null;localStorage.removeItem('sess')}}
const r=await fetch(SB+'/rest/v1/'+p,{...o,headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=representation',...(S?{Authorization:'Bearer '+S.t}:{}),...o.headers}});if(!r.ok)throw Error((await r.text()).slice(0,200));return r.status==204?null:r.json()}
async function sync(){prem=false;used=0;const u=S?.u;
if(!u){const g=L('gl',{d:'',n:[]});used=g.d==today()?g.n.length:0}
else try{const[p]=await db('profiles?select=is_premium&id=eq.'+u.id);prem=!!p?.is_premium;used=new Set((await db('watch_log?select=episode_key&watch_date=eq.'+today())).map(x=>x.episode_key)).size}catch{}
uacc()}
async function allow(k){if(prem)return true;
if(!S){const g=L('gl',{d:'',n:[]});if(g.d!=today()){g.d=today();g.n=[]}if(g.n.includes(k))return true;if(g.n.length>=LIM)return false;g.n.push(k);W('gl',g);used=g.n.length;return true}
try{if((await db('watch_log?select=id&episode_key=eq.'+k+'&watch_date=eq.'+today())).length)return true;if(used>=LIM)return false;
await db('watch_log',{method:'POST',body:JSON.stringify({user_id:S.u.id,episode_key:k,watch_date:today()})});used++;return true}catch(e){return!/LIMIT/.test(e.message)}}
/* ---- Metadata anime (Jikan / MyAnimeList) ---- */
const C={};let lr=0;
async function J(p){if(C[p])return C[p];const w=Math.max(0,lr+420-Date.now());lr=Date.now()+w;if(w)await new Promise(r=>setTimeout(r,w));
for(let i=0;i<3;i++){const r=await fetch('https://api.jikan.moe/v4/'+p);if(r.ok)return C[p]=await r.json();if(r.status!=429&&r.status<500)break;await new Promise(r=>setTimeout(r,900*(i+1)))}throw Error('jikan')}
const img=a=>a.images?.webp?.large_image_url||a.images?.jpg?.image_url||'',nm=a=>a.title_english||a.title;
const card=a=>`<a class="cd" href="#/anime/${a.mal_id}"><i style="background-image:url(${esc(img(a))})"></i>${a.score?`<em>★ ${a.score}</em>`:''}<b>${esc(nm(a))}</b><small>${esc(a.type||'')} ${a.episodes?a.episodes+' eps':'Ongoing'}</small></a>`;
const sk=n=>'<div class="sk"></div>'.repeat(n);
async function row(el,p){el.innerHTML=sk(8);try{const s=new Set();el.innerHTML=(await J(p)).data.filter(a=>!s.has(a.mal_id)&&s.add(a.mal_id)).map(card).join('')}catch{el.innerHTML='<p class="mu">Metadata belum bisa dimuat. <a class="gd" href="" onclick="location.reload();return false">Coba lagi</a></p>'}}
/* ---- Iklan sponsor (hanya user gratis) ---- */
const AD=[['Genshin Impact','Jelajahi Teyvat, unduh gratis','linear-gradient(100deg,#1d3a5f,#7a5cff 60%,#e0ae52)','https://genshin.hoyoverse.com'],['Honkai: Star Rail','Naik Astral Express sekarang','linear-gradient(100deg,#171a3a,#5b3fd0 55%,#dc3b55)','https://hsr.hoyoverse.com'],['Wuthering Waves','Open-world action RPG gratis','linear-gradient(100deg,#0e2630,#2c8c9c 55%,#e0ae52)','https://wutheringwaves.kurogames.com']];
const ads=o=>prem?'':(a=>`<a class="ad" style="background:${a[2]}" href="${a[3]}" target="_blank" rel="noopener sponsored"><small>Sponsor</small><b>${a[0]}</b><span>${a[1]}</span></a>`)(AD[((o||0)+(Date.now()/6e4|0))%3]);
/* ---- Modal ---- */
const modal=h=>$('#md').innerHTML=`<div class="mo" onclick="if(event.target==this)cl()"><div class="mb">${h}</div></div>`,cl=()=>$('#md').innerHTML='';
function login(m){cl();modal(`<h2>${m?'Buat akun':'Masuk'}</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min. 6 karakter)"><button class="bt" id="go">${m?'Daftar':'Masuk'}</button><button class="bt g" id="gg">Lanjut dengan Google</button><button class="bt g" id="gs">Masuk sebagai Tamu</button><p class="mu"><a class="gd" href="" onclick="login(${m?0:1});return false">${m?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</a></p>`);
$('#go').onclick=async()=>{try{const j=await ax(m?'signup':'token?grant_type=password',{email:$('#em').value.trim(),password:$('#pw').value});if(j.access_token){setS(j);cl();await sync();route();toast('Berhasil masuk')}else{toast('Cek email untuk konfirmasi akun');cl()}}catch(x){toast(x.message)}};
$('#gg').onclick=()=>location.href=SB+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname);
$('#gs').onclick=async()=>{try{setS(await ax('signup',{}))}catch{S=null;localStorage.removeItem('sess')}cl();await sync();route()}}
function uacc(){const b=$('#ua');b.textContent=S?(prem?'Premium':(S.u.email?S.u.email[0].toUpperCase():'Tamu')):'Masuk';b.onclick=()=>S?me():login()}
function me(){modal(`<h2>Akun</h2><p>${esc(S.u.email||'Tamu')}</p><p class="gd">${prem?'Premium aktif':'Gratis, sisa '+Math.max(0,LIM-used)+'/'+LIM+' episode hari ini'}</p>${prem?'':'<button class="bt" onclick="prm()">Upgrade Premium</button>'}<button class="bt g" onclick="chk()">Cek status premium</button><button class="bt g" onclick="out()">Keluar</button>`)}
async function chk(){await sync();toast(prem?'Premium aktif':'Belum aktif. Menunggu verifikasi admin.');cl();route()}
async function out(){S=null;localStorage.removeItem('sess');cl();await sync();route()}
function prm(){cl();modal(`<h2>Yorunime Premium</h2><p class="pr">Rp 50.000<small>/bulan</small></p><ul><li>Nonton tanpa batas, kualitas hingga 1080p</li><li>Tanpa iklan, semua fitur terbuka</li></ul><div class="gp"><div><small class="mu">GoPay</small><br><b>0888-0188-3795</b></div><button class="bt g" style="width:auto" onclick="navigator.clipboard?.writeText('088801883795');toast('Nomor disalin')">Salin</button></div><ol><li>Transfer Rp 50.000 ke nomor GoPay di atas.</li><li>Screenshot bukti transfer.</li><li><a class="gd" href="https://wa.me/${WA}" target="_blank" rel="noopener">Kirim ke admin lewat WhatsApp</a> beserta email akunmu.</li><li>Tekan tombol di bawah. Premium aktif setelah admin memverifikasi.</li></ol><button class="bt" onclick="paid()">Saya Sudah Transfer</button><button class="bt g" onclick="cl()">Tutup</button>`)}
async function paid(){if(!S?.u?.email){toast('Masuk dengan email dulu agar akunmu bisa diaktifkan');return login()}try{await db('payments',{method:'POST',body:JSON.stringify({user_id:S.u.id,email:S.u.email,amount:50000})});toast('Terkirim. Menunggu verifikasi admin.')}catch{toast('Gagal mengirim, coba lagi')}cl()}
const lim=()=>modal(`<h2>Jatah hari ini habis</h2><p class="mu">Akun gratis dibatasi ${LIM} episode per hari. Jatah kembali jam 00.00 WIB, atau buka semua batas dengan Premium.</p><button class="bt" onclick="prm()">Upgrade Premium</button><button class="bt g" onclick="cl()">Nanti saja</button>`);
function dmca(){cl();modal(`<h2>DMCA &amp; Disclaimer</h2><p class="mu">Yorunime tidak menyimpan file video di servernya. Video diputar dari sumber pihak ketiga dan data judul berasal dari MyAnimeList lewat Jikan. Pemegang hak cipta yang merasa dirugikan bisa meminta penghapusan tautan lewat tombol Lapor Link Mati atau menghubungi admin. Laporan yang valid diproses maksimal 3x24 jam.</p><button class="bt" onclick="cl()">Tutup</button>`)}
$('#bell').onclick=async()=>{try{Notification.requestPermission?.()}catch{}modal('<h2>Episode baru</h2><div id="nt" class="mu">Memuat...</div><button class="bt g" onclick="cl()">Tutup</button>');try{$('#nt').innerHTML=(await J('seasons/now?limit=6&sfw=1')).data.map(a=>`<p><a href="#/anime/${a.mal_id}" onclick="cl()"><b>${esc(nm(a))}</b><br><small>Tayang ${esc(a.broadcast?.string||'rutin')}</small></a></p>`).join('')}catch{$('#nt').textContent='Belum bisa memuat.'}};
/* ---- Halaman ---- */
function home(){const last=L('last',null),pips=Array.from({length:LIM},(_,i)=>`<i class="${i<used?'u':''}"></i>`).join('');
app.innerHTML=`<section class="hero"><h1>Malam ini, nonton apa?</h1><div class="tk">${prem?'<b class="gd">Premium aktif</b><span class="mu">Tanpa batas, tanpa iklan, 1080p</span>':`<div class="pp">${pips}</div><b>Sisa ${Math.max(0,LIM-used)}/${LIM} episode hari ini</b><span class="mu">Jatah kembali jam 00.00 WIB</span>`}</div><p>${last?`<a class="bt" href="#/tonton/${last.id}/${last.ep}">Lanjutkan ${esc(last.t)} Ep ${last.ep}</a>`:''}${prem?'':'<button class="bt g" onclick="prm()">Buka semua batas</button>'}</p></section>${ads()}<h2>Trending Hari Ini</h2><div class="rw" id="r1"></div><h2>Musim Ini</h2><div class="rw" id="r2"></div><h2>Terpopuler</h2><div class="rw" id="r3"></div><div id="r4"></div>${ads(1)}`;
row($('#r1'),'top/anime?filter=airing&limit=15&sfw=1');row($('#r2'),'seasons/now?limit=15&sfw=1');row($('#r3'),'top/anime?filter=bypopularity&limit=15&sfw=1');
if(last)J('anime/'+last.id+'/recommendations').then(r=>{$('#r4').innerHTML=`<h2>Karena kamu nonton ${esc(last.t)}</h2><div class="rw">${r.data.slice(0,12).map(x=>card(x.entry)).join('')}</div>`}).catch(()=>{})}
function cari(){app.innerHTML=`<h2>Jelajah</h2><div class="fl"><select id="fs"><option value="">Semua status</option><option value="airing">Ongoing</option><option value="complete">Completed</option></select><select id="ft"><option value="">Semua tipe</option><option value="tv">TV</option><option value="movie">Movie</option></select><select id="fg"><option value="">Semua genre</option><option value="1">Action</option><option value="10">Fantasy</option><option value="22">Romance</option><option value="4">Comedy</option><option value="8">Drama</option></select><select id="fo"><option value="order_by=popularity&sort=asc">Terpopuler</option><option value="order_by=start_date&sort=desc">Terbaru</option><option value="order_by=score&sort=desc">Rating Tertinggi</option><option value="order_by=title&sort=asc">A-Z</option></select></div><div class="gr" id="gr"></div>`;
$$('.fl select').forEach(s=>s.onchange=run);run()}
async function run(){const g=$('#gr');if(!g)return;const q=$('#qi').value.trim(),f=(k,v)=>$(k).value?`&${v}=`+$(k).value:'';g.innerHTML=sk(12);
try{const d=(await J(`anime?${q?'q='+encodeURIComponent(q)+'&':''}${$('#fo').value}&sfw=1&limit=24${f('#fs','status')}${f('#ft','type')}${f('#fg','genres')}`)).data;g.innerHTML=d.length?d.map(card).join(''):'<p class="mu">Tidak ada hasil. Coba kata kunci lain.</p>'}catch{g.innerHTML='<p class="mu">Server data sedang sibuk, coba lagi sebentar.</p>'}}
$('#qi').oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>location.hash.startsWith('#/cari')?run():location.hash='#/cari',320)};
async function det(id){app.innerHTML='<div class="sk" style="min-height:360px;margin:16px"></div>';
try{const a=(await J('anime/'+id+'/full')).data,n=a.episodes||(a.type=='Movie'?1:12),bm=L('ml',{})[id],hs=L('hs',[]);
const rel=(a.relations||[]).flatMap(r=>r.entry.filter(e=>e.type=='anime').map(e=>`<a class="ch" href="#/anime/${e.mal_id}">${esc(r.relation)}: ${esc(e.name)}</a>`));
app.innerHTML=`<section class="dt"><i style="background-image:url(${esc(img(a))})"></i><div><h1>${esc(nm(a))}</h1><p class="mu">${esc(a.title_japanese||'')} / ${esc(a.title)}</p><p class="mt"><span class="gd">★ ${a.score||'-'}</span><span>${a.status=='Currently Airing'?'Ongoing':a.status=='Finished Airing'?'Completed':esc(a.status)}</span><span>${n} episode</span><span>${esc(a.studios?.[0]?.name||'Studio belum diketahui')}</span></p><p class="mu">Jadwal rilis: ${esc(a.broadcast?.string||'belum terjadwal')}</p><p>${a.genres.map(g=>`<span class="ch">${esc(g.name)}</span>`).join('')}</p><p class="sy">${esc(a.synopsis||'Sinopsis belum tersedia.')}</p><p><a class="bt" href="#/tonton/${id}/1">Tonton Ep 1</a><button class="bt g" id="bk">${bm?'Tersimpan di Daftarku':'Simpan ke Daftarku'}</button></p></div></section>
<h2>Episode (${esc(a.type||'TV')})</h2><div class="eps">${Array.from({length:Math.min(n,300)},(_,i)=>`<a class="ep ${hs.some(x=>x.k==id+':'+(i+1))?'dn':''}" href="#/tonton/${id}/${i+1}">${i+1}</a>`).join('')}</div>${rel.length?`<h2>Season, Movie &amp; Special terkait</h2><p style="padding:0 16px">${rel.join('')}</p>`:''}${ads()}`;
$('#bk').onclick=()=>{const m=L('ml',{});m[id]?delete m[id]:m[id]={t:nm(a),i:img(a)};W('ml',m);det(id)}}catch{app.innerHTML='<p class="mu" style="padding:24px">Detail anime belum bisa dimuat. Coba lagi sebentar.</p>'}}
function list(){const m=L('ml',{}),h=L('hs',[]),e='<p class="mu" style="padding:0 16px">Masih kosong.</p>';
app.innerHTML=`<h2>Daftarku</h2><div class="gr">${Object.entries(m).map(([i,x])=>`<a class="cd" href="#/anime/${i}"><i style="background-image:url(${esc(x.i)})"></i><b>${esc(x.t)}</b></a>`).join('')||e}</div><h2>Riwayat Nonton</h2><div class="gr">${h.map(x=>`<a class="cd" href="#/tonton/${x.id}/${x.ep}"><i style="background-image:url(${esc(x.i)})"></i><b>${esc(x.t)}</b><small>Episode ${x.ep}</small></a>`).join('')||e}</div>`}
/* ---- Player ---- */
const G='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/',T='https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/';
/* Sumber DEMO (film open-source Blender). Isi tabel video_sources di Supabase dengan link video berlisensi milikmu untuk menggantinya. */
const DEMO=[{n:'Server 1',u:{all:G+'BigBuckBunny.mp4'}},{n:'Server 2 Backup',u:{all:G+'ElephantsDream.mp4'}},{n:'Server 3 HD',u:{360:T+'360/Big_Buck_Bunny_360_10s_1MB.mp4',720:T+'720/Big_Buck_Bunny_720_10s_5MB.mp4',1080:T+'1080/Big_Buck_Bunny_1080_10s_10MB.mp4'}}];
async function srcs(id,ep){try{const r=await db(`video_sources?select=server,quality,url,subtitle_url&mal_id=eq.${id}&episode=eq.${ep}&order=server`);if(r.length){const m={};r.forEach(x=>{(m[x.server]??={n:x.server,sub:x.subtitle_url,u:{}}).u[x.quality||'all']=x.url});return Object.values(m)}}catch{}return DEMO}
const vtt=(t,ep)=>URL.createObjectURL(new Blob([`WEBVTT\n\n00:00:01.000 --> 00:00:06.000\nSubtitle Indonesia aktif\n\n00:00:06.500 --> 00:00:12.000\n${t}, Episode ${ep}\n\n00:00:12.500 --> 00:00:20.000\nUbah warna dan ukuran subtitle di bawah pemutar`],{type:'text/vtt'}));
async function watch(id,ep){ep=+ep||1;await ready;app.innerHTML='<div class="pl sk"></div>';
let a;try{a=(await J('anime/'+id)).data}catch{a={title:'Anime '+id,images:{}}}
const k=id+':'+ep,t=nm(a),n=a.episodes||ep+1;
if(!(await allow(k))){location.hash='#/anime/'+id;setTimeout(lim,250);return}
const h=L('hs',[]).filter(x=>x.k!=k);h.unshift({k,id,ep,t,i:img(a)});W('hs',h.slice(0,40));W('last',{id,ep,t});document.title=t+' Ep '+ep;
app.innerHTML=`<div class="pl"><video id="v" playsinline controls preload="metadata"></video><button id="sk1" class="sk1" hidden>Lewati Intro</button><div id="ov" class="ov" hidden></div></div>
<div class="pc"><h1>${esc(t)} <span class="gd">Ep ${ep}</span></h1><div class="ctl"><select id="sv"></select><select id="ql">${[360,480,720,1080].map(q=>`<option value="${q}">${q}p${q==1080&&!prem?' (Premium)':''}</option>`).join('')}</select><label>Warna subtitle <input type="color" id="cc" value="#ffffff"></label><label>Ukuran <input type="range" id="cs" min="80" max="220" value="100"></label></div>
<a class="bt g" href="#/tonton/${id}/${ep-1}"${ep<2?' hidden':''}>Sebelumnya</a><a class="bt" href="#/tonton/${id}/${ep+1}"${ep>=n?' hidden':''}>Selanjutnya</a><button class="bt g" id="rp">Lapor Link Mati</button></div>${ads()}<h2>Rating &amp; Komentar</h2><div id="cm"></div>`;
const v=$('#v'),b=$('#sk1'),SR=await srcs(id,ep);let si=0,q=prem?1080:720,wd,lt=0;
$('#sv').innerHTML=SR.map((s,i)=>`<option value="${i}">${esc(s.n)}</option>`).join('');$('#ql').value=q;
const pick=()=>{const u=SR[si].u;return u[q]||u.all||Object.values(u)[0]};
function load(keep){const tt=keep?v.currentTime:L('pos',{})[k]||0;clearTimeout(wd);v.src=pick();$$('track',v).forEach(x=>x.remove());const tk=document.createElement('track');Object.assign(tk,{kind:'subtitles',srclang:'id',label:'Indonesia',src:SR[si].sub||vtt(t,ep),default:true});v.append(tk);$('#sv').value=si;
v.onloadedmetadata=()=>{if(tt>3&&tt<v.duration-5)v.currentTime=tt;v.play().catch(()=>{});try{tk.track.mode='showing'}catch{}};v.onloadeddata=()=>clearTimeout(wd);wd=setTimeout(()=>{if(v.readyState<2)v.onerror()},12000)}
v.onerror=()=>{clearTimeout(wd);if(si<SR.length-1){si++;toast('Server bermasalah, pindah ke '+SR[si].n);load(1)}else{const o=$('#ov');o.hidden=false;o.innerHTML='<b>Semua server gagal dimuat</b><span class="mu">Cek koneksi lalu coba lagi, atau laporkan link mati.</span><button class="bt" onclick="route()">Coba lagi</button>'}};
v.ontimeupdate=()=>{const c=v.currentTime,d=v.duration||0,o=d&&d-c<80&&ep<n;b.hidden=!(o||(c>4&&c<95));b.textContent=o?'Lewati Outro':'Lewati Intro';b.dataset.o=o?1:'';if(Date.now()-lt>4e3){lt=Date.now();const p=L('pos',{});p[k]=c;W('pos',p)}};
b.onclick=()=>v.currentTime=b.dataset.o?v.duration:90;
v.onended=()=>{if(ep<n){toast('Lanjut ke episode '+(ep+1));location.hash=`#/tonton/${id}/${ep+1}`}};
$('#sv').onchange=e=>{si=+e.target.value;load(1)};
$('#ql').onchange=e=>{const x=+e.target.value;if(x==1080&&!prem){e.target.value=q;return prm()}q=x;load(1)};
$('#cc').oninput=e=>document.documentElement.style.setProperty('--sc',e.target.value);
$('#cs').oninput=e=>document.documentElement.style.setProperty('--ss',e.target.value+'%');
$('#rp').onclick=()=>db('reports',{method:'POST',body:JSON.stringify({anime_id:+id,episode:ep,server:SR[si].n})}).then(()=>toast('Laporan terkirim, terima kasih')).catch(()=>toast('Laporan gagal dikirim'));
load();cmts(id,ep)}
async function cmts(id,ep){let r=[];try{r=await db(`comments?select=name,rating,body&anime_id=eq.${id}&episode=eq.${ep}&order=created_at.desc&limit=20`)}catch{}
$('#cm').innerHTML=`<div class="cf"><select id="rt">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} ★</option>`).join('')}</select><input id="cb" maxlength="300" placeholder="${S?.u?.email?'Tulis komentar':'Masuk untuk berkomentar'}"><button class="bt" style="margin:0" id="cs2">Kirim</button></div>`+(r.map(x=>`<div class="cmt"><b>${esc(x.name)}</b> <span class="gd">${'★'.repeat(x.rating||0)}</span><p>${esc(x.body)}</p></div>`).join('')||'<p class="mu" style="padding:12px 16px">Belum ada komentar untuk episode ini.</p>');
$('#cs2').onclick=async()=>{if(!S?.u?.email)return login();const body=$('#cb').value.trim();if(!body)return;try{await db('comments',{method:'POST',body:JSON.stringify({anime_id:+id,episode:ep,user_id:S.u.id,name:S.u.email.split('@')[0],rating:+$('#rt').value,body})});cmts(id,ep)}catch{toast('Komentar gagal dikirim')}}}
/* ---- Router & boot ---- */
function route(){const p=location.hash.slice(2).split('/');scrollTo(0,0);document.title='Yorunime - Nonton Anime Sub Indo';({'':home,cari,list,anime:()=>det(p[1]),tonton:()=>watch(p[1],p[2]),premium:()=>{home();prm()}}[p[0]]||home)()}
addEventListener('hashchange',route);
(async()=>{const h=location.hash;if(h.includes('access_token=')){const p=new URLSearchParams(h.slice(1)),t=p.get('access_token');try{setS({access_token:t,refresh_token:p.get('refresh_token'),expires_in:+p.get('expires_in'),user:await ax('user',null,t)})}catch{}history.replaceState(null,'',location.pathname+'#/')}
ready=sync();route();ready.then(()=>{if(!location.hash.startsWith('#/tonton'))route()})})();
</script></body></html>
